[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "faro-experiment-lab"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.2.6","pandas==2.3.3","scipy==1.15.3","statsmodels==0.14.5","pyarrow==26.0.1","psycopg[binary]==3.3.9","PyYAML==6.0.3","jsonschema==4.26.0","psutil==7.2.2"]

[project.scripts]
faro-exp = "faro_exp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
faro_exp = ["*.sql","*.html"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4","E7","E9","F","I","B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires a dedicated PostgreSQL database"]
