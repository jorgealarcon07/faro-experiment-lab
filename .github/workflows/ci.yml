name: Verify Faro experiment lab
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: faro_ci
          POSTGRES_PASSWORD: ephemeral_ci_only
          POSTGRES_USER: faro_exp
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 3s --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGDATABASE: faro_ci
      PGUSER: faro_exp
      PGPASSWORD: ephemeral_ci_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pip check
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: faro-exp validate
      - run: python -m pytest -q --junitxml=local/tests.xml
